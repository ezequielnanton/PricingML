name: Build Windows Installers

on:
  push:
    branches:
      - main
      - claude/motor-cliente-instalacion-i9vvt3
    paths:
      - 'PricingEngine/**'
      - 'PricingClient/**'
      - 'build-installers/**'
      - '.github/workflows/build-installers.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - claude/motor-cliente-instalacion-i9vvt3

jobs:
  build-installers:
    runs-on: windows-latest
    name: Build Motor and Cliente Installers

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install WiX Toolset
        run: |
          choco install wix -y
          echo "C:\Program Files (x86)\WiX Toolset v3\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore NuGet packages
        run: dotnet restore PricingEngine/src/PricingApi/PricingApi.csproj

      - name: Build Motor
        run: |
          cd PricingEngine/src/PricingApi
          dotnet publish -c Release -o "bin/Release/net10.0/publish" --no-self-contained

      - name: Install Client dependencies
        run: |
          cd PricingClient/pricing-ui
          npm ci

      - name: Build Client
        run: |
          cd PricingClient/pricing-ui
          npm run build

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build Motor and Client Installers (MSI)
        run: |
          cd build-installers
          .\build-all-msi.ps1
        shell: powershell

      - name: Upload Motor Installer
        uses: actions/upload-artifact@v4
        with:
          name: PricingML-Motor
          path: dist/PricingML-Motor.msi
          retention-days: 30

      - name: Upload Client Installer
        uses: actions/upload-artifact@v4
        with:
          name: PricingML-Cliente
          path: dist/PricingML-Cliente.msi
          retention-days: 30

      - name: Create Release with Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: PricingML ${{ github.ref_name }}
          body: |
            ## Instaladores MSI - PricingML ${{ github.ref_name }}

            ### Descargas
            - **Motor**: `PricingML-Motor.msi` - Servicio API REST (.NET 10.0)
            - **Cliente**: `PricingML-Cliente.msi` - Interfaz Web (React 19)

            ### Requisitos del Sistema
            - Windows 10/11 (64-bit)
            - .NET 10.0 Runtime
            - Node.js 18+
            - SQL Server 2022+ o LocalDB

            ### Instrucciones de Instalación

            1. **Descargar** ambos instaladores desde abajo
            2. **Ejecutar** `PricingML-Motor.msi`
               - Responde las preguntas de configuración
               - Configura conexión SQL Server
            3. **Iniciar Motor**
               - Abre Services.msc
               - Busca "PricingML Motor API"
               - Click derecho → Iniciar
            4. **Ejecutar** `PricingML-Cliente.msi`
               - Configura URL del Motor
            5. **Acceder** a http://localhost:3000

            ### Documentación
            - [Guía Instalación](INSTALADORES-MSI.md)
            - [Guía Técnica](build-installers/README-MSI.md)
            - [API Swagger](http://localhost:5000/swagger)

            ---
            **Generado automáticamente por GitHub Actions**
          files: |
            dist/PricingML-Motor.msi
            dist/PricingML-Cliente.msi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: |
          Write-Host "❌ Build failed" -ForegroundColor Red
          exit 1

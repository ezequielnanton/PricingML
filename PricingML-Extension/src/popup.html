<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PricingML - Capturar Competidor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-width: 400px;
            background: #f5f5f5;
        }

        .container {
            padding: 16px;
            background: white;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .header h1 {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #424242;
            margin-bottom: 4px;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 8px 10px;
            font-size: 12px;
            border: 1px solid #dadada;
            border-radius: 4px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.1);
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #0066cc;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #0052a3;
            box-shadow: 0 2px 8px rgba(0, 102, 204, 0.3);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #1a1a1a;
            border: 1px solid #dadada;
        }

        .btn-secondary:hover {
            background: #efefef;
        }

        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 4px;
            font-size: 12px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading-spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #ccc;
            border-top: 2px solid #0066cc;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-section {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 11px;
            color: #666;
            border-left: 3px solid #0066cc;
        }

        .error-icon {
            color: #d9534f;
            margin-right: 4px;
        }

        .success-icon {
            color: #5cb85c;
            margin-right: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 PricingML</h1>
        </div>

        <form id="competitorForm">
            <div class="info-section">
                ℹ️ Completa los datos del competidor que estás viendo en MercadoLibre
            </div>

            <div class="form-group">
                <label for="meliItemId">ID de MercadoLibre *</label>
                <input type="text" id="meliItemId" name="meliItemId" placeholder="MLA123456789" required>
            </div>

            <div class="form-group">
                <label for="titulo">Título del producto *</label>
                <input type="text" id="titulo" name="titulo" placeholder="Nike Air Max 90..." required>
            </div>

            <div class="form-group">
                <label for="precio">Precio *</label>
                <input type="number" id="precio" name="precio" step="0.01" min="0" placeholder="15999" required>
            </div>

            <div class="form-group">
                <label for="moneda">Moneda</label>
                <select id="moneda" name="moneda">
                    <option value="1">ARS - Peso Argentino</option>
                    <option value="2">USD - Dólar</option>
                    <option value="3">BRL - Real Brasileño</option>
                    <option value="4">MXN - Peso Mexicano</option>
                    <option value="5">CLP - Peso Chileno</option>
                </select>
            </div>

            <div class="form-group">
                <label for="vendedor">Vendedor (opcional)</label>
                <input type="text" id="vendedor" name="vendedor" placeholder="otro_store">
            </div>

            <div class="button-group">
                <button type="submit" class="btn-primary" id="btnGuardar">
                    💾 Guardar a PricingML
                </button>
                <button type="reset" class="btn-secondary">
                    🔄 Limpiar
                </button>
            </div>
        </form>

        <div id="status" class="status"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>

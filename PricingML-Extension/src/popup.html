<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PricingML - Capturar Competidor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-width: 400px;
            background: #f5f5f5;
        }

        .container {
            padding: 16px;
            background: white;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .header h1 {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #424242;
            margin-bottom: 4px;
        }

        input[type="text"],
        input[type="number"],
        input[type="password"],
        select {
            width: 100%;
            padding: 8px 10px;
            font-size: 12px;
            border: 1px solid #dadada;
            border-radius: 4px;
            font-family: inherit;
            background: white;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.1);
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #0066cc;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #0052a3;
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #1a1a1a;
            border: 1px solid #dadada;
        }

        .btn-secondary:hover {
            background: #efefef;
        }

        .btn-link {
            flex: 0 0 auto;
            background: none;
            border: none;
            color: #0066cc;
            font-size: 11px;
            font-weight: 500;
            padding: 2px 4px;
            text-decoration: underline;
        }

        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 4px;
            font-size: 12px;
            display: none;
            line-height: 1.5;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .info-section {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 11px;
            color: #666;
            border-left: 3px solid #0066cc;
            line-height: 1.5;
        }

        .config-panel {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .config-panel p {
            font-size: 11px;
            color: #666;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .hint {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>PricingML</h1>
            <button type="button" class="btn-link" id="btnConfig">Configuración</button>
        </div>

        <div class="config-panel" id="configPanel" hidden>
            <p>
                La sesión se toma sola de PricingML abierto en otra pestaña, así que no hay
                ningún token para copiar. Lo único configurable es dónde corre el Motor.
            </p>
            <div class="form-group">
                <label for="apiUrl">URL del Motor</label>
                <input type="text" id="apiUrl" placeholder="http://localhost:5000">
            </div>
            <div class="button-group">
                <button type="button" class="btn-primary" id="btnGuardarConfig">Guardar</button>
            </div>
        </div>

        <form id="competitorForm">
            <div class="info-section" id="infoSection">
                Elegí a qué publicación tuya le compite este producto y revisá el precio antes de guardar.
            </div>

            <div class="form-group">
                <label for="publicacion">Tu publicación *</label>
                <select id="publicacion" required></select>
                <div class="hint" id="publicacionHint"></div>
            </div>

            <div class="form-group">
                <label for="competidorItemId">ID o link del competidor *</label>
                <input type="text" id="competidorItemId" placeholder="MLA123456789" required>
            </div>

            <div class="form-group">
                <label for="titulo">Título del competidor</label>
                <input type="text" id="titulo" placeholder="Nike Air Max 90...">
            </div>

            <div class="form-group">
                <label for="precio">Precio del competidor *</label>
                <input type="number" id="precio" step="0.01" min="0" placeholder="15999" required>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-primary" id="btnGuardar">Guardar a PricingML</button>
                <button type="reset" class="btn-secondary">Limpiar</button>
            </div>
        </form>

        <div id="status" class="status"></div>

        <div class="button-group" id="accionAbrirApp" hidden>
            <button type="button" class="btn-secondary" id="btnAbrirApp">Abrir PricingML para iniciar sesión</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>

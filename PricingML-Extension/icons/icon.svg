<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="128" height="128" fill="#0066cc" rx="24"/>

  <!-- Gráfico de precios (línea) -->
  <polyline points="24,80 40,60 56,70 72,40 88,50 104,30"
            stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Puntos de datos -->
  <circle cx="40" cy="60" r="3" fill="white"/>
  <circle cx="56" cy="70" r="3" fill="white"/>
  <circle cx="72" cy="40" r="3" fill="white"/>
  <circle cx="88" cy="50" r="3" fill="white"/>

  <!-- Símbolo de dinero -->
  <circle cx="24" cy="100" r="8" fill="white" opacity="0.6"/>
  <text x="24" y="105" font-size="10" text-anchor="middle" fill="#0066cc" font-weight="bold">$</text>

  <!-- Símbolo de comparación -->
  <circle cx="104" cy="100" r="8" fill="white" opacity="0.6"/>
  <text x="104" y="104" font-size="10" text-anchor="middle" fill="#0066cc" font-weight="bold">≈</text>
</svg>
